# =============================================================================
# FantaCTV - Coolify Deployment Configuration
# =============================================================================
# This docker-compose.yml is designed for deployment on Coolify.
# Environment variables should be configured in Coolify's UI.
# =============================================================================

version: "3.8"

services:
  fantactv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantactv
    restart: unless-stopped

    # Port mapping
    ports:
      - "3000:3000"

    # Environment variables - Configure these in Coolify UI
    environment:
      # Node environment
      - NODE_ENV=production

      # Firebase Client Configuration (Public)
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}

      # Firebase Admin SDK (Server-side only - Keep secret!)
      - FIREBASE_ADMIN_SERVICE_ACCOUNT=${FIREBASE_ADMIN_SERVICE_ACCOUNT}

      # NextAuth.js Configuration
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

    # Health check configuration
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
        tag: "{{.Name}}/{{.ID}}"

    # Labels for Coolify/Traefik (if using reverse proxy)
    labels:
      - "coolify.managed=true"
      - "coolify.service=fantactv"

# =============================================================================
# Networks (optional - Coolify may manage this automatically)
# =============================================================================
networks:
  default:
    name: fantactv-network
    driver: bridge
